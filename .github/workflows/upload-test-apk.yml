name: Upload test APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the signed test APK
        run: |
          curl -fL --retry 5 --retry-all-errors \
            -o HaioPass-4.0.0-test1.apk \
            https://tools.haiocloud.com/dl/haiopass-4.0.0-test-1c74d6a5e3ea1871.apk
          echo "b8236a71e0982f8069e15deb924c24ee077a19804f94d5fdc9ab38b1d48157c4  HaioPass-4.0.0-test1.apk" | sha256sum -c -

      - name: Attach it to the existing v3.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v3.0.0 HaioPass-4.0.0-test1.apk \
            --repo haioco/haiopass-app --clobber
