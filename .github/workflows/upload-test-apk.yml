name: Upload test APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/v2-udp-full-access

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the signed test APK
        run: |
          curl -fL --retry 5 --retry-all-errors \
            -o HaioPass-4.0.1-test1.apk \
            https://tools.haiocloud.com/dl/haiopass-4.0.1-test-78ef128e.apk
          echo "78ef128e90bcf3b24006b9fd0f01820aaa5f485e52b87f992b2aa524cd293af8  HaioPass-4.0.1-test1.apk" | sha256sum -c -

      - name: Attach it to the existing v3.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v3.0.0 HaioPass-4.0.1-test1.apk \
            --repo haioco/haiopass-app --clobber
